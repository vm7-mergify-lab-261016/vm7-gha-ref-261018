name: VM7 GHA default ref provenance 261018
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Record attacker fork workflow provenance
        shell: bash
        run: |
          cat > provenance.json <<JSON
          {"marker":"ATTACKER_FORK_WORKFLOW_261018","sha":"${GITHUB_SHA}","ref":"${GITHUB_REF}","repository":"${GITHUB_REPOSITORY}","event":"${GITHUB_EVENT_NAME}"}
          JSON
      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm7-gha-default-ref-provenance-261018
          path: provenance.json
